[project]
name = "nhl-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "matplotlib>=3.10.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests-cache>=1.3.3",
    "streamlit>=1.50.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
nhl-pipeline = "nhl_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
